# NightTerrors 1.3 - strasidelni mobove, kteri nahrazuji prirozene spawny.
# Po zmene: /nt reload
#
# U kazdeho moba:
#   entity          vanilla telo (ZOMBIE, SPIDER, ENDERMAN, ...)
#   replaces        ktere prirozene spawny muze nahradit
#   chance-percent  sance v % na jeden spawn (1 = kazdy cca 100. mob)
#   worlds          seznam svetu, [] = vsechny
#   only-at-night   spawn jen v noci
#   surface-only    spawn jen pod otevrenym nebem (ne v jeskynich)
#   max-alive       kolik jich muze zit najednou v jednom svete
#   speed           vanilla atribut rychlosti (zombie ma 0.23)
#   scale           velikost (1.0 = normalni)
#   knockback       jak daleko odhodi hrace pri zasahu (0 = jen vanilla)
#   model           vlastni vzhled z resource packu (stalker, watcher, ripper, crawler); prazdne = vanilla telo
#   model-yaw-offset  kdyby model koukal dozadu, dej 180
#   sound.key       libovolny zvuk hry nebo resource packu
#   behavior.type   STALKER | GROWER | LEAPER | WATCHER | NONE

settings:
  despawn-at-day: true     # za usvitu zmizi v koure
  view-angle: 65           # pulka zorneho uhlu hrace ve stupnich (pro STALKER a WATCHER)

# Zvuky pluginu jsou v malem resource packu, ktery se hraci nabidne pri pripojeni.
# Kdo ho odmitne, vlastni zvuky neuslysi.
resource-pack:
  enabled: true
  url: "https://raw.githubusercontent.com/Kozlik296/NightTerrors/main/pack/NightTerrors-pack.zip"
  sha1: "cf971d9118461a986f9949d6bb6ee6e3f332a019"

mobs:
  stalker:
    enabled: true
    entity: WITHER_SKELETON
    replaces: [ZOMBIE]
    chance-percent: 1.0
    worlds: []
    only-at-night: true
    surface-only: true
    max-alive: 3
    health: 40
    damage: 9
    speed: 0.3
    scale: 1.4
    follow-range: 48
    silent: true
    clear-equipment: true
    model: "stalker"
    model-yaw-offset: 0
    sound:
      key: "nightterrors:stalker"
      radius: 20
      interval-ticks: 50
      volume: 1.0
      pitch: 1.0
    behavior:
      type: STALKER
      range: 48            # na jakou vzdalenost si vybere hrace
      approach-speed: 1.6  # nasobic rychlosti, kdyz se nikdo nediva
      flee-speed: 2.5      # nasobic rychlosti pri uteku
      flee-distance: 9     # kdyz se divas a jsi bliz nez tohle, utika
      attack-reach: 2.5

  giant_spider:
    enabled: true
    entity: SPIDER
    replaces: [SPIDER]
    chance-percent: 1.0
    worlds: []
    only-at-night: true
    surface-only: true
    max-alive: 2
    health: 50
    damage: 7
    speed: 0.3
    scale: 1.3
    follow-range: 40
    silent: true
    clear-equipment: false
    model: ""
    model-yaw-offset: 0
    sound:
      key: "nightterrors:spider"
      radius: 24
      interval-ticks: 50
      volume: 1.0
      pitch: 1.0
    behavior:
      type: GROWER
      max-scale: 4.5       # velikost po plnem narustu
      grow-seconds: 25     # jak dlouho te musi honit, nez doroste
      speed-bonus: 0.6     # +60 % rychlosti pri plne velikosti
      damage-bonus: 1.5    # +150 % poskozeni pri plne velikosti

  crawler:
    enabled: true
    entity: SILVERFISH
    replaces: [ZOMBIE, SKELETON]
    chance-percent: 1.0
    worlds: []
    only-at-night: true
    surface-only: false
    max-alive: 4
    health: 24
    damage: 8
    speed: 0.46
    scale: 3.5
    follow-range: 32
    silent: true
    clear-equipment: false
    model: "crawler"
    model-yaw-offset: 0
    sound:
      key: "nightterrors:crawler"
      radius: 14
      interval-ticks: 36
      volume: 1.0
      pitch: 1.0
    behavior:
      type: LEAPER
      min-distance: 3
      max-distance: 8
      cooldown-ticks: 60
      horizontal: 1.2
      vertical: 0.35     # minimalni vyskok; jinak miri na oblicej
      face-blind-ticks: 30 # po zasahu do obliceje te na chvili oslepi (0 = vypnuto)

  ripper:
    enabled: true
    entity: ZOGLIN
    replaces: [CREEPER]
    chance-percent: 1.0
    worlds: []
    only-at-night: true
    surface-only: true
    max-alive: 2
    health: 90
    damage: 15
    speed: 0.42
    knockback: 2.0
    scale: 1.2
    follow-range: 40
    silent: true
    clear-equipment: false
    model: "ripper"
    model-yaw-offset: 0
    sound:
      key: "nightterrors:ripper"
      radius: 24
      interval-ticks: 70
      volume: 1.0
      pitch: 1.0
    behavior:
      type: NONE

  watcher:
    enabled: true
    entity: HUSK
    replaces: [SKELETON]
    chance-percent: 1.0
    worlds: []
    only-at-night: true
    surface-only: true
    max-alive: 3
    health: 40
    damage: 1
    speed: 0.3
    scale: 1.5
    follow-range: 64
    silent: true
    clear-equipment: true
    model: "watcher"
    model-yaw-offset: 0
    sound:
      key: "nightterrors:watcher"
      radius: 28
      interval-ticks: 110
      volume: 1.0
      pitch: 1.0
    behavior:
      type: WATCHER
      range: 64            # na jakou dalku te sleduje pohledem
      vanish-distance: 7   # kdyz prijdes bliz, zmizi
      effect-range: 24     # kdyz na tebe zira z teto vzdalenosti a vidi te, zacne ti problikavat obrazovka a silit zvuk
      stare-seconds: 10    # za jak dlouho efekt dosahne maxima; pak zakrici, ubere a zmizi (0 = vypnuto). Schovej se za zed.
      stare-damage: 6      # poskozeni pri maximu (6 = 3 srdce)
      stare-sound: "nightterrors:static"
      stare-scream: "nightterrors:scream"
