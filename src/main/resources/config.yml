# NightTerrors 1.6 - strasidelni mobove, kteri nahrazuji prirozene spawny.
# Po zmene: /nt reload
#
# U kazdeho moba:
#   entity          vanilla telo (ZOMBIE, SPIDER, ENDERMAN, ...)
#   replaces        ktere prirozene spawny muze nahradit
#   chance-percent  sance v % na jeden spawn (1 = kazdy cca 100. mob)
#   worlds          seznam svetu, [] = vsechny
#   only-at-night   spawn jen v noci
#   surface-only    spawn jen pod otevrenym nebem (ne v jeskynich)
#   speed           vanilla atribut rychlosti (zombie ma 0.23)
#   scale           velikost (1.0 = normalni)
#   knockback       jak daleko odhodi hrace pri zasahu (0 = jen vanilla)
#   model           vlastni vzhled z resource packu (stalker, watcher, ripper, crawler, spider); prazdne = vanilla telo
#   model-yaw-offset  kdyby model koukal dozadu, dej 180
#   sound.key       libovolny zvuk hry nebo resource packu
#   dodge-projectiles  sance 0-1, ze mob uhne sipu/trojzubci
#   xp              kolik XP z nej padne (-1 = jako vanilla telo)
#   group-size      kolik se jich spawne najednou (smecka)
#   persistent      true = nezmizi za usvitu ani kdyz odejdes
#   sleeps-by-day   true = pres den spi, dokud se hrac nepriblizi na wake-range nebo ho neuderi
#   behavior.type   STALKER | GROWER | LEAPER | WATCHER | HUNTER | BURROWER | MIMIC | NONE
#   max-alive       pocita se pro cely server (jen nactene chunky)

settings:
  despawn-at-day: true     # za usvitu zmizi v koure
  view-angle: 65           # pulka zorneho uhlu hrace ve stupnich (pro STALKER a WATCHER)
  # Zprava, kterou hrac uvidi v chatu po pripojeni. Barvy pres &, prazdny seznam [] = nic neposilat.
  join-message:
    - "&c&l[NightTerrors] &r&cPozor na Breachera!"
    - "&7Obr bez kuze rozbiji &fdrevo, prkna, ploty, dvere, branky, listi, vlnu a sklo&7."
    - "&7Kamen a tvrdsi bloky nezbori. &fStav hradby a dum z kamene&7, jinak ti je znici."
    - "&7Pres den spi, dokud k nemu neprijdes. Citi te i pres zdi."
    - "&7Mensi tlusty obr (Climber) nic nebori, ale &fvyleze po kolme zdi&7. Na slunci shori."

# Zvuky pluginu jsou v malem resource packu, ktery se hraci nabidne pri pripojeni.
# Kdo ho odmitne, vlastni zvuky neuslysi.
resource-pack:
  enabled: true
  url: "https://raw.githubusercontent.com/Kozlik296/NightTerrors/main/pack/NightTerrors-pack.zip"
  sha1: "2ff5896afb8ab4452ef63146f552c4d919e23b4c"

