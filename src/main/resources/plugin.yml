name: NightTerrors
version: 1.6.0
main: dev.kozlik.nightterrors.NightTerrors
api-version: '1.21'
description: Scary custom mobs that replace natural spawns with a configurable chance.
commands:
  nightterrors:
    description: NightTerrors admin command
    aliases: [nt]
    permission: nightterrors.admin
    usage: /nt <spawn|kill|list|killall|reload>
permissions:
  nightterrors.admin:
    default: op
